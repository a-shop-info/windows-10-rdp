name: Windows Cloud RDP (16GB RAM / SSD)

on:
  workflow_dispatch:
    inputs:
      tunnel_provider:
        description: 'Select Tunnel Provider'
        required: true
        default: 'ngrok'
        type: choice
        options:
          - ngrok
          - cloudflared
      ngrok_token:
        description: 'Ngrok Auth Token (Required if using Ngrok - get free at dashboard.ngrok.com)'
        required: false
        default: ''
        type: string
      ngrok_region:
        description: 'Ngrok Region (us, eu, ap, au, sa, jp, in)'
        required: false
        default: 'us'
        type: string
      admin_password:
        description: 'Windows Administrator Password'
        required: false
        default: 'Password123!'
        type: string

jobs:
  build:
    name: Launch Windows Cloud VM
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Windows Remote Desktop (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: Set Administrator Credentials
        shell: powershell
        run: |
          net user runneradmin "${{ github.event.inputs.admin_password }}"
          net user /add admin "${{ github.event.inputs.admin_password }}"
          net localgroup administrators admin /add

      - name: Start Cloudflared Tunnel (If selected)
        if: ${{ github.event.inputs.tunnel_provider == 'cloudflared' }}
        shell: powershell
        run: |
          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile C:\Windows\System32\cloudflared.exe
          Start-Process cloudflared -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "cloudflared.log"
          Start-Sleep -Seconds 8
          Get-Content "cloudflared.log" | Select-String "trycloudflare.com"

      - name: Start Ngrok Tunnel (If selected)
        if: ${{ github.event.inputs.tunnel_provider == 'ngrok' }}
        shell: powershell
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath C:\Windows\System32
          ngrok config add-authtoken "${{ github.event.inputs.ngrok_token }}"
          Start-Process ngrok -ArgumentList "tcp 3389 --region ${{ github.event.inputs.ngrok_region }}"
          Start-Sleep -Seconds 6
          $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
          $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", ""
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host "   🎉 WINDOWS CLOUD RDP IS READY TO CONNECT!" -ForegroundColor Green
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host " 🖥️ RDP Address : $tunnelUrl" -ForegroundColor Yellow
          Write-Host " 👤 Username    : runneradmin (or admin)" -ForegroundColor Yellow
          Write-Host " 🔑 Password    : ${{ github.event.inputs.admin_password }}" -ForegroundColor Yellow
          Write-Host "=================================================" -ForegroundColor Green

      - name: Keep-Alive Loop (Up to 6 Hours)
        shell: powershell
        run: |
          for ($i = 1; $i -le 355; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "Keep-Alive: [$(Get-Date -Format 'HH:mm:ss')] Cloud VM active ($i min elapsed)..."
          }
