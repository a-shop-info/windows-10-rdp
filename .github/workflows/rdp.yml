name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Launch Windows Cloud VM
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Ngrok
        shell: powershell
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath C:\Windows\System32
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          net user runneradmin "root"
          net user /add admin "root"
          net localgroup administrators admin /add

      - name: Start RDP Tunnel
        shell: powershell
        run: |
          Start-Process ngrok -ArgumentList "tcp 3389 --region us"
          Start-Sleep -Seconds 6
          $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
          $tunnelUrl = $response.tunnels[0].public_url -replace "tcp://", ""
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host "   🎉 WINDOWS CLOUD RDP IS READY TO CONNECT!" -ForegroundColor Green
          Write-Host "=================================================" -ForegroundColor Green
          Write-Host " 🖥️ RDP Address : $tunnelUrl" -ForegroundColor Yellow
          Write-Host " 👤 Username    : runneradmin (or admin)" -ForegroundColor Yellow
          Write-Host " 🔑 Password    : root" -ForegroundColor Yellow
          Write-Host "=================================================" -ForegroundColor Green

      - name: Keep-Alive Loop
        shell: powershell
        run: |
          for ($i = 1; $i -le 355; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "Keep-Alive: [$(Get-Date -Format 'HH:mm:ss')] VM active ($i min elapsed)..."
          }
